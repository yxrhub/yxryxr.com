<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云下人：无限世界 | Coming Soon</title>
    <meta name="description" content="《云下人：无限世界》是一个基于坐标系的无限像素世界。核心深耕种田养老，边缘缝合探险、贸易、自动化与社会模拟。在这里，你可以体验到极致缝合带来的无限玩法，与万千玩家共同定义这个世界。" />
    <meta name="keywords" content="云下人, 种田养老, 无限地图, 玩法缝合, 沙盒游戏, 像素贸易, 自动化种田, 开放世界模拟, yxryxr, yxr" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        :root {
            --bg-dark: #12121a;
            --accent: #ffcc00;  
            --pixel-border: #ffffff;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated; 
        }

        body, html {
            background-color: var(--bg-dark);
            font-family: 'ZCOOL KuaiLe', 'Courier New', monospace;
            color: var(--text);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Coming Soon 标志 --- */
        .coming-soon-badge {
            background: #e74c3c;
            color: white;
            padding: 8px 16px;
            font-size: 1.2rem;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 6px 6px 0px #000; }
            100% { transform: scale(1); }
        }

        .main-title {
            font-size: 3.5rem;
            color: var(--accent);
            text-shadow: 6px 6px 0px #000;
            margin-bottom: 15px;
            text-align: center;
        }

        .sub-slogan {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #ccc;
            text-shadow: 2px 2px 0px #000;
            max-width: 700px;
            text-align: center;
            margin-bottom: 60px;
        }

        /* --- 卡片区域 --- */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 60px;
            width: 100%;
        }

        .feature-card {
            background: rgba(20, 20, 30, 0.85);
            border: 4px solid var(--pixel-border);
            padding: 30px 20px;
            box-shadow: 8px 8px 0px 0px #000;
            position: relative;
            overflow: hidden;
        }

        /* 卡片右上角的“待解锁”小标签 */
        .feature-card::after {
            content: "LOCKED";
            position: absolute;
            top: 10px;
            right: -30px;
            background: #555;
            font-size: 0.7rem;
            padding: 2px 40px;
            transform: rotate(45deg);
        }

        .pixel-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }

        .feature-card h3 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
        }

        .feature-card p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #bbb;
        }

        /* --- 交互区域 --- */
        .action-area {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
        }

        .btn {
            background: #333;
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.1s;
        }

        .btn:hover {
            background-color: var(--accent);
            color: #000;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #000;
        }

        .dev-status {
            font-size: 1rem;
            color: #666;
            letter-spacing: 2px;
        }

        /* --- 移动端适配 --- */
        @media (max-width: 850px) {
            .features-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 2.2rem; }
            .container { padding: 40px 20px; }
            .coming-soon-badge { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="pixel-bg"></div>
    <div class="overlay"></div>

    <div class="container">
        
        <div class="coming-soon-badge">PROJECT: COMING SOON</div>

        <h1 class="main-title">万顷云下，种田只是开始。</h1>
        <p class="sub-slogan">
            纯粹的养老底色，极致的玩法缝合<br>
            万人同服的无边界大世界
        </p>

        <div class="features-grid">
            <div class="feature-card">
                <span class="pixel-icon">🌾</span>
                <h3>纯粹种田养老</h3>
                <p>没有战力焦虑，没有副本打卡。底层机制严格保护你的田园生活，任何人与战斗逻辑都无法打破这份宁静。</p>
            </div>

            <div class="feature-card">
                <span class="pixel-icon">🤝</span>
                <h3>万人地缘生态</h3>
                <p>这不仅是一个人的农场。翻过山头是真实的邻居，跨越几千个坐标去贸易。这里只有玩家自发建立的社会。</p>
            </div>

            <div class="feature-card">
                <span class="pixel-icon">🧩</span>
                <h3>极致缝合玩法</h3>
                <p>在种田底色之外，缝合了跨区贸易、自动化流水线、深层地核探索。你想怎么玩，世界就能缝合出什么可能。</p>
            </div>
        </div>

        <div class="action-area">
            <a href="#" class="btn">查看开发日志</a>
            <a href="#" class="btn">加入社区等待</a>
        </div>

        <p class="dev-status">服务器构建中... 预计连接建立 [PENDING]</p>
    </div>

</body>
</html>
